name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"] # Change to "master" if your default branch is named master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Inject Secret into index.html
        env:
          HOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          sed -i "s|REPLACE_WITH_DISCORD_WEBHOOK|$HOOK_URL|g" index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
