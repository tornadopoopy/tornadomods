<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <!-- Webpage Title (Browser Tab Name) -->
  <title>Tornado Hub</title>
  
  <!-- Fonts & Font Awesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --gradient-blue: #1e3aff;
      --gradient-purple: #8b00ff;
      --gradient-magenta: #d80075;
      --gradient-red: #ff003c;
      
      --glass-base: rgba(18, 10, 38, 0.55);
      --glass-border: rgba(255, 255, 255, 0.2);
      --glass-highlight: rgba(255, 255, 255, 0.45);
      --text-main: #ffffff;
      --text-sub: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* Vibrant Blue to Purple to Magenta Gradient Background */
    body {
      background: linear-gradient(135deg, #1822e6 0%, #7d12db 45%, #ca0a6d 80%, #ff0d2d 100%);
      color: var(--text-main);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 16px;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient Liquid Orbs */
    .liquid-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      z-index: 0;
      pointer-events: none;
      animation: floatOrb 10s ease-in-out infinite alternate;
    }

    .orb-1 {
      width: 500px;
      height: 500px;
      background: rgba(30, 58, 255, 0.45);
      top: -150px;
      left: -150px;
    }

    .orb-2 {
      width: 500px;
      height: 500px;
      background: rgba(255, 0, 60, 0.4);
      bottom: -150px;
      right: -150px;
      animation-delay: -5s;
    }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, 50px) scale(1.1); }
    }

    /* Frosted Liquid Glass Card Container */
    .hub-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 460px;
      min-height: 640px;
      padding: 48px 36px;
      background: var(--glass-base);
      backdrop-filter: blur(35px) saturate(180%);
      -webkit-backdrop-filter: blur(35px) saturate(180%);
      border-radius: 40px;
      border: 1px solid var(--glass-border);
      box-shadow: 
        0 30px 80px rgba(0, 0, 0, 0.6),
        inset 0 1.5px 0 var(--glass-highlight),
        inset 0 -1.5px 0 rgba(0, 0, 0, 0.4);
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Page Switcher */
    .page {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .page.hidden {
      display: none;
      opacity: 0;
      transform: scale(0.96);
    }

    /* Profile Avatar Header */
    .avatar-wrapper {
      position: relative;
      width: 110px;
      height: 110px;
      margin: 0 auto 20px auto;
    }

    .avatar-glow-ring {
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2b4bff, #ff007f);
      filter: blur(18px);
      opacity: 0.8;
    }

    .avatar-glass-box {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: rgba(15, 10, 30, 0.8);
      border: 2px solid rgba(255, 255, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: inset 0 4px 15px rgba(255, 255, 255, 0.2);
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    /* Header & Tag */
    h1 {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(180deg, #ffffff 0%, #e2e8f0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
      word-break: break-word;
    }

    .user-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 18px;
      border-radius: 25px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 32px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }

    /* Liquid Glass Menu List */
    .menu-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
    }

    /* Interactive Liquid Buttons */
    .liquid-item {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 20px 24px;
      border-radius: 24px;
      text-decoration: none;
      color: var(--text-main);
      font-size: 1.05rem;
      font-weight: 700;
      border: 1px solid var(--glass-border);
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.15) 0%,
        rgba(255, 255, 255, 0.05) 60%,
        rgba(0, 0, 0, 0.2) 100%
      );
      box-shadow: 
        0 10px 25px rgba(0, 0, 0, 0.3),
        inset 0 1px 0 var(--glass-highlight);
      cursor: pointer;
      overflow: hidden;
      transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* Liquid Sheen Animation */
    .liquid-item::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -150%;
      width: 200%;
      height: 200%;
      background: linear-gradient(
        60deg,
        transparent,
        rgba(255, 255, 255, 0.4),
        transparent
      );
      transform: rotate(25deg);
      transition: 0.6s ease;
    }

    .liquid-item:hover, .liquid-item:active {
      transform: translateY(-4px) scale(1.02);
      border-color: rgba(255, 255, 255, 0.6);
      box-shadow: 
        0 15px 35px rgba(230, 10, 100, 0.35),
        inset 0 1px 2px rgba(255, 255, 255, 0.7);
    }

    .liquid-item:hover::before {
      left: 100%;
    }

    .btn-left-content {
      display: flex;
      align-items: center;
      gap: 16px;
      z-index: 2;
    }

    .btn-left-content i {
      font-size: 1.4rem;
      transition: transform 0.3s ease;
    }

    .liquid-item:hover .btn-left-content i {
      transform: scale(1.2);
    }

    .arrow-icon {
      font-size: 1rem;
      opacity: 0.6;
      z-index: 2;
      transition: all 0.3s ease;
    }

    .liquid-item:hover .arrow-icon {
      opacity: 1;
      transform: translateX(5px);
      color: #ffffff;
    }

    .btn-discord:hover, .btn-discord:active {
      background: linear-gradient(135deg, rgba(88, 101, 242, 0.5) 0%, rgba(88, 101, 242, 0.2) 100%);
      border-color: rgba(140, 150, 255, 0.8);
      box-shadow: 0 15px 35px rgba(88, 101, 242, 0.4);
    }

    /* Future Updates Page Layout */
    .notice-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 28px 20px;
      margin: 20px 0 30px 0;
      width: 100%;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }

    .notice-text {
      font-size: 1.05rem;
      color: var(--text-main);
      line-height: 1.6;
      font-weight: 600;
    }

    .btn-back {
      justify-content: center;
      background: rgba(255, 255, 255, 0.08);
    }

    /* Modal Styling */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 5, 25, 0.75);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      padding: 20px;
    }

    .modal-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-box {
      background: rgba(25, 10, 40, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 32px;
      padding: 36px 24px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(216, 0, 117, 0.3);
      transform: scale(0.85);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .modal-backdrop.active .modal-box {
      transform: scale(1);
    }

    .modal-btn {
      width: 100%;
      padding: 14px;
      border-radius: 16px;
      border: none;
      background: linear-gradient(135deg, #1e3aff, #d80075);
      color: #ffffff;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 20px;
      box-shadow: 0 8px 20px rgba(216, 0, 117, 0.4);
    }

    /* Mobile Responsive Optimizations */
    @media (max-width: 480px) {
      body {
        padding: 16px 12px;
      }

      .hub-card {
        padding: 36px 20px;
        border-radius: 32px;
        min-height: auto;
      }

      .avatar-wrapper {
        width: 95px;
        height: 95px;
        margin-bottom: 16px;
      }

      h1 {
        font-size: 1.85rem;
      }

      .user-tag {
        font-size: 0.88rem;
        padding: 5px 14px;
        margin-bottom: 24px;
      }

      .menu-list {
        gap: 16px;
      }

      .liquid-item {
        padding: 18px 20px;
        font-size: 1rem;
        border-radius: 20px;
      }

      .orb-1 {
        width: 300px;
        height: 300px;
      }

      .orb-2 {
        width: 300px;
        height: 300px;
      }
    }
  </style>
</head>
<body>

  <!-- Ambient Liquid Glow Background Orbs -->
  <div class="liquid-orb orb-1"></div>
  <div class="liquid-orb orb-2"></div>

  <!-- Main Card Container -->
  <div class="hub-card">
    
    <!-- PAGE 1: Main Menu -->
    <div id="mainPage" class="page">
      
      <div class="avatar-wrapper">
        <div class="avatar-glow-ring"></div>
        <div class="avatar-glass-box">
          <img src="TornadoIcon.png" alt="Tornado Icon" class="avatar-img">
        </div>
      </div>

      <h1>Tornado Hub</h1>
      <div class="user-tag">
        <i class="fa-brands fa-discord"></i> @_tornadog_
      </div>

      <div class="menu-list">
        
        <!-- Discord Link -->
        <a href="https://discord.gg/uYeG2sagqV" target="_blank" class="liquid-item btn-discord">
          <div class="btn-left-content">
            <i class="fa-brands fa-discord" style="color: #7289da;"></i>
            <span>Discord Server</span>
          </div>
          <i class="fa-solid fa-arrow-right-long arrow-icon"></i>
        </a>

        <!-- DLLS Button -->
        <button class="liquid-item" onclick="openModal()">
          <div class="btn-left-content">
            <i class="fa-solid fa-cube" style="color: #ff52a8;"></i>
            <span>DLLS</span>
          </div>
          <i class="fa-solid fa-chevron-right arrow-icon"></i>
        </button>

        <!-- Future Updates Switcher -->
        <button class="liquid-item" onclick="switchTab('futurePage')">
          <div class="btn-left-content">
            <i class="fa-solid fa-compass" style="color: #7b73ff;"></i>
            <span>Future Updates</span>
          </div>
          <i class="fa-solid fa-chevron-right arrow-icon"></i>
        </button>

      </div>
    </div>

    <!-- PAGE 2: Future Updates Page -->
    <div id="futurePage" class="page hidden">
      
      <div class="avatar-wrapper" style="width: 80px; height: 80px;">
        <div class="avatar-glass-box">
          <img src="TornadoIcon.png" alt="Tornado Icon" class="avatar-img">
        </div>
      </div>

      <h1>Future Roadmap</h1>
      <div class="user-tag">
        <i class="fa-solid fa-wrench"></i> In Progress
      </div>

      <div class="notice-card">
        <p class="notice-text">
          This page is being worked on and no this is not a error i just wrote this
        </p>
      </div>

      <button class="liquid-item btn-back" onclick="switchTab('mainPage')">
        <div class="btn-left-content">
          <i class="fa-solid fa-arrow-left"></i>
          <span>Back to Hub</span>
        </div>
      </button>

    </div>

  </div>

  <!-- Modal for DLLS -->
  <div id="modalOverlay" class="modal-backdrop" onclick="closeModalOnOutside(event)">
    <div class="modal-box">
      <i class="fa-solid fa-hourglass-half" style="font-size: 2.5rem; color: #ff52a8; margin-bottom: 15px;"></i>
      <h2 style="font-size: 1.5rem; margin-bottom: 10px;">DLLS Status</h2>
      <p style="color: var(--text-sub); font-size: 0.95rem;">This module is currently under construction and will release soon.</p>
      <button class="modal-btn" onclick="closeModal()">Coming Soon</button>
    </div>
  </div>

  <script>
    function switchTab(pageId) {
      document.getElementById('mainPage').classList.toggle('hidden', pageId !== 'mainPage');
      document.getElementById('futurePage').classList.toggle('hidden', pageId !== 'futurePage');
    }

    function openModal() {
      document.getElementById('modalOverlay').classList.add('active');
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('active');
    }

    function closeModalOnOutside(e) {
      if (e.target.id === 'modalOverlay') closeModal();
    }
  </script>

</body>
</html>
