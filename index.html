<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tornado Hub | Liquid Glass Edition</title>
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --bg-navy: #020617;
      --bg-black: #000000;
      --cyan-neon: #00f2fe;
      --blue-electric: #4facfe;
      --glass-base: rgba(15, 23, 42, 0.55);
      --glass-border: rgba(255, 255, 255, 0.15);
      --glass-highlight: rgba(255, 255, 255, 0.4);
      --text-main: #ffffff;
      --text-sub: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      user-select: none;
    }

    /* Navy Blue to Black Deep Gradient Background */
    body {
      background: radial-gradient(circle at 50% -20%, #0f172a 0%, #020617 60%, #000000 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient Liquid Orbs */
    .liquid-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      z-index: 0;
      pointer-events: none;
      animation: floatOrb 10s ease-in-out infinite alternate;
    }

    .orb-1 {
      width: 450px;
      height: 450px;
      background: rgba(0, 242, 254, 0.15);
      top: -100px;
      left: -100px;
    }

    .orb-2 {
      width: 500px;
      height: 500px;
      background: rgba(79, 172, 254, 0.18);
      bottom: -150px;
      right: -100px;
      animation-delay: -5s;
    }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, 50px) scale(1.1); }
    }

    /* Taller & Sleeker Liquid Glass Card */
    .hub-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 460px;
      min-height: 680px;
      padding: 48px 36px;
      background: var(--glass-base);
      backdrop-filter: blur(30px) saturate(200%);
      -webkit-backdrop-filter: blur(30px) saturate(200%);
      border-radius: 40px;
      border: 1px solid var(--glass-border);
      box-shadow: 
        0 30px 80px rgba(0, 0, 0, 0.8),
        inset 0 1.5px 0 var(--glass-highlight),
        inset 0 -1.5px 0 rgba(0, 0, 0, 0.6);
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Page Navigation Logic */
    .page {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .page.hidden {
      display: none;
      opacity: 0;
      transform: scale(0.96);
    }

    /* Avatar Header */
    .avatar-wrapper {
      position: relative;
      width: 110px;
      height: 110px;
      margin: 0 auto 20px auto;
    }

    .avatar-glow-ring {
      position: absolute;
      inset: -5px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--cyan-neon), var(--blue-electric));
      filter: blur(15px);
      opacity: 0.6;
    }

    .avatar-glass-box {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: rgba(2, 6, 23, 0.85);
      border: 2px solid rgba(255, 255, 255, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      color: var(--cyan-neon);
      box-shadow: inset 0 4px 15px rgba(255, 255, 255, 0.15);
    }

    /* Static Icon (No Rotation) */
    .avatar-glass-box i {
      transform: none !important;
      animation: none !important;
    }

    /* User Details */
    h1 {
      font-size: 2.3rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    .user-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 18px;
      border-radius: 25px;
      background: rgba(0, 242, 254, 0.08);
      border: 1px solid rgba(0, 242, 254, 0.3);
      color: var(--cyan-neon);
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 36px;
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.15);
    }

    /* Extended Liquid Glass Menu */
    .menu-list {
      display: flex;
      flex-direction: column;
      gap: 22px; /* Taller menu distribution */
      width: 100%;
    }

    /* Interactive Liquid Glass Buttons */
    .liquid-item {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 22px 26px;
      border-radius: 24px;
      text-decoration: none;
      color: var(--text-main);
      font-size: 1.1rem;
      font-weight: 700;
      border: 1px solid var(--glass-border);
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.12) 0%,
        rgba(255, 255, 255, 0.03) 60%,
        rgba(0, 0, 0, 0.3) 100%
      );
      box-shadow: 
        0 10px 25px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 var(--glass-highlight);
      cursor: pointer;
      overflow: hidden;
      transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* Liquid Sheen Hover Effect */
    .liquid-item::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -150%;
      width: 200%;
      height: 200%;
      background: linear-gradient(
        60deg,
        transparent,
        rgba(255, 255, 255, 0.35),
        transparent
      );
      transform: rotate(25deg);
      transition: 0.6s ease;
    }

    .liquid-item:hover {
      transform: translateY(-5px) scale(1.02);
      border-color: rgba(0, 242, 254, 0.6);
      box-shadow: 
        0 15px 35px rgba(0, 242, 254, 0.25),
        inset 0 1px 2px rgba(255, 255, 255, 0.6);
    }

    .liquid-item:hover::before {
      left: 100%;
    }

    .btn-left-content {
      display: flex;
      align-items: center;
      gap: 16px;
      z-index: 2;
    }

    .btn-left-content i {
      font-size: 1.4rem;
      transition: transform 0.3s ease;
    }

    .liquid-item:hover .btn-left-content i {
      transform: scale(1.2);
    }

    .arrow-icon {
      font-size: 1rem;
      opacity: 0.4;
      z-index: 2;
      transition: all 0.3s ease;
    }

    .liquid-item:hover .arrow-icon {
      opacity: 1;
      transform: translateX(5px);
      color: var(--cyan-neon);
    }

    /* Specific Button Highlights */
    .btn-discord:hover {
      background: linear-gradient(135deg, rgba(88, 101, 242, 0.4) 0%, rgba(88, 101, 242, 0.1) 100%);
      border-color: rgba(88, 101, 242, 0.8);
      box-shadow: 0 15px 35px rgba(88, 101, 242, 0.35);
    }

    /* Page 2 (Future Page) Styling */
    .notice-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 30px 24px;
      margin: 25px 0 35px 0;
      width: 100%;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    .notice-text {
      font-size: 1.1rem;
      color: var(--text-main);
      line-height: 1.6;
      font-weight: 600;
    }

    .btn-back {
      justify-content: center;
      background: rgba(255, 255, 255, 0.05);
    }

    /* DLLS Modal Overlay */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.8);
      backdrop-filter: blur(15px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      padding: 20px;
    }

    .modal-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-box {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(0, 242, 254, 0.4);
      border-radius: 32px;
      padding: 40px 30px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9), 0 0 40px rgba(0, 242, 254, 0.25);
      transform: scale(0.85);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .modal-backdrop.active .modal-box {
      transform: scale(1);
    }

    .modal-btn {
      width: 100%;
      padding: 14px;
      border-radius: 16px;
      border: none;
      background: linear-gradient(135deg, var(--cyan-neon), var(--blue-electric));
      color: #020617;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <!-- Ambient Liquid Background Glows -->
  <div class="liquid-orb orb-1"></div>
  <div class="liquid-orb orb-2"></div>

  <!-- Main Glass Card Container -->
  <div class="hub-card">
    
    <!-- PAGE 1: Main Menu -->
    <div id="mainPage" class="page">
      
      <div class="avatar-wrapper">
        <div class="avatar-glow-ring"></div>
        <div class="avatar-glass-box">
          <i class="fa-solid fa-tornado"></i>
        </div>
      </div>

      <h1>Tornado</h1>
      <div class="user-tag">
        <i class="fa-brands fa-discord"></i> @Tornado
      </div>

      <div class="menu-list">
        
        <!-- Discord Server -->
        <a href="https://discord.gg/uYeG2sagqV" target="_blank" class="liquid-item btn-discord">
          <div class="btn-left-content">
            <i class="fa-brands fa-discord" style="color: #5865F2;"></i>
            <span>Discord Server</span>
          </div>
          <i class="fa-solid fa-arrow-right-long arrow-icon"></i>
        </a>

        <!-- DLLS Button -->
        <button class="liquid-item" onclick="openModal()">
          <div class="btn-left-content">
            <i class="fa-solid fa-cube" style="color: var(--cyan-neon);"></i>
            <span>DLLS</span>
          </div>
          <i class="fa-solid fa-chevron-right arrow-icon"></i>
        </button>

        <!-- Future Updates Button -->
        <button class="liquid-item" onclick="switchTab('futurePage')">
          <div class="btn-left-content">
            <i class="fa-solid fa-compass" style="color: var(--blue-electric);"></i>
            <span>Future Updates</span>
          </div>
          <i class="fa-solid fa-chevron-right arrow-icon"></i>
        </button>

      </div>
    </div>

    <!-- PAGE 2: Future Updates Roadmap -->
    <div id="futurePage" class="page hidden">
      
      <div class="avatar-wrapper" style="width: 80px; height: 80px;">
        <div class="avatar-glass-box" style="font-size: 2rem;">
          <i class="fa-solid fa-code-branch" style="color: var(--cyan-neon);"></i>
        </div>
      </div>

      <h1>Future Roadmap</h1>
      <div class="user-tag">
        <i class="fa-solid fa-wrench"></i> In Progress
      </div>

      <div class="notice-card">
        <p class="notice-text">
          This page is being worked on and no this is not a error i just wrote this
        </p>
      </div>

      <button class="liquid-item btn-back" onclick="switchTab('mainPage')">
        <div class="btn-left-content">
          <i class="fa-solid fa-arrow-left"></i>
          <span>Back to Hub</span>
        </div>
      </button>

    </div>

  </div>

  <!-- DLLS Liquid Glass Modal -->
  <div id="modalOverlay" class="modal-backdrop" onclick="closeModalOnOutside(event)">
    <div class="modal-box">
      <i class="fa-solid fa-hourglass-half" style="font-size: 2.5rem; color: var(--cyan-neon); margin-bottom: 15px;"></i>
      <h2 style="font-size: 1.6rem; margin-bottom: 10px;">DLLS Status</h2>
      <p style="color: var(--text-sub); font-size: 0.95rem;">This module is currently under construction and will release soon.</p>
      <button class="modal-btn" onclick="closeModal()">Coming Soon</button>
    </div>
  </div>

  <script>
    function switchTab(pageId) {
      document.getElementById('mainPage').classList.toggle('hidden', pageId !== 'mainPage');
      document.getElementById('futurePage').classList.toggle('hidden', pageId !== 'futurePage');
    }

    function openModal() {
      document.getElementById('modalOverlay').classList.add('active');
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('active');
    }

    function closeModalOnOutside(e) {
      if (e.target.id === 'modalOverlay') closeModal();
    }
  </script>

</body>
</html>
