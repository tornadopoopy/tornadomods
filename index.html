<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tornado Hub</title>
  <!-- Google Fonts & Font Awesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --navy-dark: #030712;
      --navy-mid: #0b1528;
      --navy-accent: #1e293b;
      --cyan-glow: #00f0ff;
      --blue-glow: #3b82f6;
      --glass-bg: rgba(15, 23, 42, 0.45);
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-shine: rgba(255, 255, 255, 0.25);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Space Grotesk', sans-serif;
      user-select: none;
    }

    /* Deep Navy Blue to Black Animated Gradient Background */
    body {
      background: radial-gradient(circle at 50% 0%, #0d1d3a 0%, #030712 70%, #000000 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }

    /* Ambient Liquid Orbs in Background */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      z-index: 0;
      pointer-events: none;
      animation: float 12s infinite ease-in-out alternate;
    }

    .orb-1 {
      width: 450px;
      height: 450px;
      background: rgba(0, 240, 255, 0.15);
      top: -100px;
      left: -100px;
    }

    .orb-2 {
      width: 500px;
      height: 500px;
      background: rgba(59, 130, 246, 0.18);
      bottom: -150px;
      right: -100px;
      animation-delay: -6s;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(50px, 40px) scale(1.1); }
    }

    /* Central Liquid Glass Container */
    .glass-hub {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      padding: 40px 32px;
      background: var(--glass-bg);
      backdrop-filter: blur(28px) saturate(190%);
      -webkit-backdrop-filter: blur(28px) saturate(190%);
      border-radius: 32px;
      border: 1px solid var(--glass-border);
      box-shadow: 
        0 30px 60px rgba(0, 0, 0, 0.7),
        inset 0 1px 0 rgba(255, 255, 255, 0.2),
        inset 0 -1px 0 rgba(0, 0, 0, 0.5);
      text-align: center;
      animation: hubAppear 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes hubAppear {
      0% { opacity: 0; transform: translateY(30px) scale(0.95); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Avatar Container with Pulsing Glass Ring */
    .avatar-container {
      position: relative;
      width: 105px;
      height: 105px;
      margin: 0 auto 20px auto;
    }

    .avatar-glow {
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--cyan-glow), var(--blue-glow));
      filter: blur(12px);
      opacity: 0.6;
      animation: pulseGlow 4s infinite alternate;
    }

    @keyframes pulseGlow {
      0% { opacity: 0.4; transform: scale(0.98); }
      100% { opacity: 0.8; transform: scale(1.05); }
    }

    .avatar-glass {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: rgba(11, 21, 40, 0.8);
      border: 1.5px solid rgba(255, 255, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.8rem;
      color: var(--cyan-glow);
      box-shadow: inset 0 4px 10px rgba(255, 255, 255, 0.2);
    }

    .avatar-glass i {
      animation: tornadoSpin 15s linear infinite;
    }

    @keyframes tornadoSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Titles & Handles */
    h1 {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    .handle-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 16px;
      border-radius: 20px;
      background: rgba(0, 240, 255, 0.06);
      border: 1px solid rgba(0, 240, 255, 0.25);
      color: var(--cyan-glow);
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 32px;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.1);
    }

    /* Liquid Glass Buttons Stack */
    .menu-stack {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* Liquid Glass Button Base Styling */
    .liquid-btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 18px 24px;
      border-radius: 20px;
      text-decoration: none;
      color: var(--text-main);
      font-size: 1.05rem;
      font-weight: 600;
      border: 1px solid var(--glass-border);
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.1) 0%,
        rgba(255, 255, 255, 0.03) 50%,
        rgba(0, 0, 0, 0.2) 100%
      );
      box-shadow: 
        0 8px 20px rgba(0, 0, 0, 0.3),
        inset 0 1px 0 var(--glass-shine);
      cursor: pointer;
      overflow: hidden;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* Liquid Highlight Light Beam Effect */
    .liquid-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.3),
        transparent
      );
      transition: 0.6s ease;
    }

    /* Hover State for Buttons */
    .liquid-btn:hover {
      transform: translateY(-4px) scale(1.02);
      border-color: rgba(0, 240, 255, 0.5);
      box-shadow: 
        0 12px 30px rgba(0, 240, 255, 0.25),
        inset 0 1px 1px rgba(255, 255, 255, 0.5);
    }

    .liquid-btn:hover::before {
      left: 100%;
    }

    .btn-left {
      display: flex;
      align-items: center;
      gap: 14px;
      z-index: 2;
    }

    .btn-left i {
      font-size: 1.3rem;
      transition: transform 0.3s ease;
    }

    .liquid-btn:hover .btn-left i {
      transform: scale(1.2) rotate(-5deg);
    }

    .arrow-icon {
      font-size: 0.9rem;
      opacity: 0.5;
      z-index: 2;
      transition: all 0.3s ease;
    }

    .liquid-btn:hover .arrow-icon {
      opacity: 1;
      transform: translateX(4px);
      color: var(--cyan-glow);
    }

    /* Specific Discord Accent Styling */
    .btn-discord:hover {
      background: linear-gradient(
        135deg,
        rgba(88, 101, 242, 0.3) 0%,
        rgba(88, 101, 242, 0.1) 100%
      );
      border-color: rgba(88, 101, 242, 0.6);
      box-shadow: 0 12px 30px rgba(88, 101, 242, 0.35);
    }

    /* Dynamic Glass Modal (DLLS Popup) */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(3, 7, 18, 0.75);
      backdrop-filter: blur(12px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      padding: 20px;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-radius: 28px;
      padding: 35px 30px;
      max-width: 360px;
      width: 100%;
      text-align: center;
      box-shadow: 
        0 25px 50px rgba(0, 0, 0, 0.8),
        0 0 30px rgba(0, 240, 255, 0.2);
      transform: scale(0.8);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .modal-overlay.active .modal-card {
      transform: scale(1);
    }

    .modal-icon {
      width: 60px;
      height: 60px;
      margin: 0 auto 15px auto;
      border-radius: 50%;
      background: rgba(0, 240, 255, 0.1);
      border: 1px solid var(--cyan-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      color: var(--cyan-glow);
    }

    .modal-card h2 {
      font-size: 1.5rem;
      margin-bottom: 8px;
    }

    .modal-card p {
      color: var(--text-sub);
      font-size: 0.95rem;
      margin-bottom: 24px;
    }

    .close-btn {
      width: 100%;
      padding: 12px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, var(--cyan-glow), var(--blue-glow));
      color: #030712;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .close-btn:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <!-- Ambient Liquid Glow Background Orbs -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <!-- Central Glass Hub Card -->
  <div class="glass-hub">
    
    <!-- Profile Avatar -->
    <div class="avatar-container">
      <div class="avatar-glow"></div>
      <div class="avatar-glass">
        <i class="fa-solid fa-tornado"></i>
      </div>
    </div>

    <!-- User Information -->
    <h1>Tornado</h1>
    <div class="handle-pill">
      <i class="fa-brands fa-discord"></i> @Tornado
    </div>

    <!-- Interactive Liquid Glass Menu -->
    <div class="menu-stack">
      
      <!-- Discord Server Button -->
      <a href="https://discord.gg/uYeG2sagqV" target="_blank" class="liquid-btn btn-discord">
        <div class="btn-left">
          <i class="fa-brands fa-discord" style="color: #5865F2;"></i>
          <span>Discord Server</span>
        </div>
        <i class="fa-solid fa-arrow-right-long arrow-icon"></i>
      </a>

      <!-- DLLS Button -->
      <button class="liquid-btn" onclick="openModal()">
        <div class="btn-left">
          <i class="fa-solid fa-cube" style="color: var(--cyan-glow);"></i>
          <span>DLLS</span>
        </div>
        <i class="fa-solid fa-chevron-right arrow-icon"></i>
      </button>

    </div>

  </div>

  <!-- Liquid Glass Popup Modal -->
  <div id="modalOverlay" class="modal-overlay" onclick="closeModalOnOuter(event)">
    <div class="modal-card">
      <div class="modal-icon">
        <i class="fa-solid fa-hourglass-half"></i>
      </div>
      <h2>DLLS Project</h2>
      <p>This module is currently under active development. Stay tuned for future updates!</p>
      <button class="close-btn" onclick="closeModal()">Coming Soon</button>
    </div>
  </div>

  <script>
    function openModal() {
      document.getElementById('modalOverlay').classList.add('active');
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('active');
    }

    function closeModalOnOuter(e) {
      if (e.target.id === 'modalOverlay') {
        closeModal();
      }
    }
  </script>

</body>
</html>
